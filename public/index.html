ki<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#212121">
<title>IA AFRICA CORE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#212121;color:#ececec;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;flex-direction:column
}
header{
 padding:16px 20px;border-bottom:1px solid #383838;
 display:flex;align-items:center;gap:12px
}
.logo{
 width:38px;height:38px;border-radius:50%;
 background:#10a37f;display:grid;place-items:center;
 font-weight:bold;color:white
}
header h1{font-size:18px;margin:0}
header small{color:#aaa}
main{
 width:100%;max-width:850px;margin:auto;
 flex:1;padding:25px 16px 130px
}
.welcome{text-align:center;margin:65px 0 35px}
.welcome h2{font-size:27px}
.welcome p{color:#aaa}
#messages{display:flex;flex-direction:column;gap:22px}
.message{
 padding:15px 18px;border-radius:15px;
 line-height:1.65;white-space:pre-wrap;
 overflow-wrap:anywhere
}
.user{background:#303030;align-self:flex-end;max-width:85%}
.assistant{align-self:stretch;background:#292929}
.composer-area{
 position:fixed;bottom:0;left:0;right:0;
 background:linear-gradient(transparent,#212121 20%);
 padding:18px 14px 12px
}
.composer{
 max-width:850px;margin:auto;background:#303030;
 border:1px solid #505050;border-radius:18px;
 padding:12px;display:flex;gap:10px;align-items:flex-end
}
textarea{
 flex:1;resize:none;min-height:48px;max-height:150px;
 border:0;outline:0;background:transparent;color:white;
 font-size:16px;padding:12px
}
select{
 background:#303030;color:#ddd;border:1px solid #555;
 border-radius:9px;padding:9px;max-width:125px
}
button{
 background:#10a37f;color:white;border:0;
 border-radius:12px;padding:12px 17px;
 font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.status{
 text-align:center;color:#999;font-size:12px;
 padding-top:9px
}
footer{
 text-align:center;color:#888;font-size:12px;
 padding:10px
}
@media(max-width:500px){
 .welcome{margin-top:45px}
 .composer{gap:6px;padding:8px}
 select{max-width:100px;font-size:12px}
 button{padding:12px}
}
</style>
</head>

<body>
<header>
 <div class="logo">IA</div>
 <div>
  <h1>IA AFRICA CORE</h1>
  <small>Votre intelligence artificielle</small>
 </div>
</header>

<main>
 <section class="welcome" id="welcome">
  <h2>Bonjour !</h2>
  <p>Je suis IA AFRICA CORE. Comment puis-je vous aider aujourd'hui ?</p>
 </section>

 <section id="messages"></section>
</main>

<div class="composer-area">
 <div class="composer">
  <select id="language" aria-label="Langue de réponse">
   <option value="auto">Automatique</option>
   <option value="français">Français</option>
   <option value="anglais">Anglais</option>
   <option value="haoussa">Haoussa</option>
   <option value="zarma">Zarma</option>
  </select>

  <textarea id="question" placeholder="Écrivez votre message..." rows="1"></textarea>

  <button id="send" type="button">Envoyer</button>
 </div>
 <div class="status" id="status">IA AFRICA CORE est prête</div>
</div>

<footer>IA AFRICA CORE · Créé par Abdou Souley Issaka</footer>

<script>
const question = document.getElementById("question");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const statusText = document.getElementById("status");
const language = document.getElementById("language");

function getStableUserId() {
  let id = localStorage.getItem("iaAfricaUserId");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("iaAfricaUserId", id);
  }

  return id;
}

const userId = getStableUserId();
 
function addMessage(text, role) {
 const div = document.createElement("div");
 div.className = "message " + role;
 div.textContent = text;
 messages.appendChild(div);
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
 return div;
}

async function sendMessage() {
 const content = question.value.trim();
 if (!content || send.disabled) return;

 welcome.style.display = "none";
 addMessage(content, "user");
 question.value = "";
 question.style.height = "48px";
 send.disabled = true;
 statusText.textContent = "IA AFRICA CORE réfléchit...";

 const reply = addMessage("Réponse en cours...", "assistant");

 try {
  const response = await fetch("/api/chat", {
   method: "POST",
   headers: {"Content-Type":"application/json"},
   body: JSON.stringify({
    type: "text",
    content: content,userId: userId,
    language: language.value === "auto" ? undefined : language.value
   })
  });

  const data = await response.json();

  if (!response.ok || data.success === false) {
   throw new Error(data.error || "Une erreur est survenue.");
  }

  const answer =
   data.answer ??
   data.response ??
   data.text ??
   data.content ??
   data.output ??
   data.result;

  if (typeof answer === "string") {
   reply.textContent = answer;
  } else if (answer !== undefined) {
   reply.textContent = JSON.stringify(answer, null, 2);
  } else {
   reply.textContent = JSON.stringify(data, null, 2);
  }

  statusText.textContent = "IA AFRICA CORE est prête";
 } catch (error) {
  reply.textContent = "Impossible d'obtenir une réponse : " + error.message;
  statusText.textContent = "Erreur de connexion";
 }

 send.disabled = false;
 question.focus();
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

send.addEventListener("click", sendMessage);

question.addEventListener("keydown", function(event) {
 if (event.key === "Enter" && !event.shiftKey) {
  event.preventDefault();
  sendMessage();
 }
});

question.addEventListener("input", function() {
 this.style.height = "48px";
 this.style.height = Math.min(this.scrollHeight,150) + "px";
});
</script>
</body>
</html>
